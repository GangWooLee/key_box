name: CI

on:
  push:
  pull_request:

jobs:
  analyze-and-test:
    # 개발 플랫폼(macOS) 일치 — sqlcipher_flutter_libs 등 네이티브 의존 빌드 대비.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.41.2
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Drift 생성 코드(*.g.dart)는 .gitignore로 미커밋 — CI는 매 런 재생성해야
      # 한다. 이 스텝이 없으면 analyze가 605건(undefined DAO getter 등)으로
      # 즉사한다(Flutter 마이그레이션 이후 CI가 한 번도 green이 아니었던 원인).
      - name: Generate code (Drift)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze

      # NOTE: `dart format` 게이트는 CI에서 의도적으로 제외한다.
      # 현재 53개 파일에 포맷 드리프트가 있어 도입 즉시 CI가 적색이 된다.
      # 포맷은 로컬 lefthook pre-commit(dart format --set-exit-if-changed)이 점진 수렴시킨다.

      # Golden tests (tag: golden) are excluded — they rasterize real fonts and
      # are sensitive to the runner's OS text renderer. They are a local design
      # -review tool for the V9 redesign, run manually with `--tags golden`.
      - name: Test (unit + widget)
        run: flutter test --exclude-tags golden

      # Cipher gate: macOS `flutter test` loads Apple's system libsqlite3, which
      # silently ignores `PRAGMA key` — so the encryption / rotation / backup-v3
      # layers are NOT exercised by the unit suite. Only integration_test builds
      # the real app (CocoaPods bundles the SQLCipher dylib) and proves the keyed
      # round-trip. Run each file in its own `flutter test` invocation with one
      # retry: back-to-back files in a single invocation can hit a macOS app
      # launch flake, but a fresh invocation per file is reliable.
      - name: Integration tests (cipher — real SQLCipher)
        run: |
          fail=0
          for f in integration_test/*_test.dart; do
            echo "::group::$f"
            flutter test "$f" -d macos || flutter test "$f" -d macos || fail=1
            echo "::endgroup::"
          done
          exit $fail
