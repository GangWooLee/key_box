name: key_box
description: AES-256-GCM encrypted secret manager for macOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # Database (encrypted SQLite)
  drift: ^2.22.0
  sqlcipher_flutter_libs: ^0.6.0
  # Raw sqlite3 access: VaultMigrator drives sqlcipher_export/ATTACH on
  # temporary copies that drift's fixed-path connection cannot address.
  sqlite3: ^2.4.0

  # Routing
  go_router: ^14.0.0

  # Encryption
  pointycastle: ^3.9.0

  # macOS native
  window_manager: ^0.4.0

  # Icons
  lucide_icons: ^0.257.0

  # Utils
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  file_selector: ^1.0.3
  uuid: ^4.0.0
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  drift_dev: ^2.22.0
  riverpod_generator: ^2.6.0
  flutter_lints: ^4.0.0
  mocktail: ^1.0.0
  # Integration tests: cipher-dependent gates must run in the real macOS app
  # (cipher_positive_test, encrypted_vault_test).
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # V9 «SLAB & BENCH» — single IBM Plex family, two faces (Sans UI + Mono
  # display/values), 3 weights each (400/500/600). Inter + JetBrains removed.
  fonts:
    - family: IBM Plex Sans
      fonts:
        - asset: assets/fonts/IBMPlexSans-Regular.ttf
        - asset: assets/fonts/IBMPlexSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexSans-SemiBold.ttf
          weight: 600
    - family: IBM Plex Mono
      fonts:
        - asset: assets/fonts/IBMPlexMono-Regular.ttf
        - asset: assets/fonts/IBMPlexMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/IBMPlexMono-SemiBold.ttf
          weight: 600
