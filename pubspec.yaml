name: key_box
description: AES-256-GCM encrypted secret manager for macOS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # Database (encrypted SQLite)
  drift: ^2.22.0
  sqlcipher_flutter_libs: ^0.6.0

  # Routing
  go_router: ^14.0.0

  # Encryption
  pointycastle: ^3.9.0

  # macOS native
  window_manager: ^0.4.0

  # Icons
  lucide_icons: ^0.257.0

  # Fonts
  google_fonts: ^6.0.0

  # Utils
  shared_preferences: ^2.3.0
  path_provider: ^2.1.0
  uuid: ^4.0.0
  intl: ^0.19.0
  collection: ^1.18.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  build_runner: ^2.4.0
  drift_dev: ^2.22.0
  riverpod_generator: ^2.6.0
  flutter_lints: ^4.0.0
  mocktail: ^1.0.0

flutter:
  uses-material-design: true
